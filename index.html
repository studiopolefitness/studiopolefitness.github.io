<html lang="es">

<title>Studio Pole & Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#FBF6F2;
    --surface:#FFFFFF;
    --ink:#241220;
    --muted:#8B7E88;
    --line:#EEE1DD;
    --accent:#C6425E;
    --accent-ink:#FFFFFF;
    --gold:#E8A33D;
    --green:#4C8B5A;
    --amber:#C4831F;
    --red:#C6425E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;padding-bottom:76px;}

  header.topbar{padding:18px 20px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line);}
  header.topbar .brand{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  header.topbar .logo-img{height:34px;width:auto;display:block;}
  header.topbar h1{display:none;}
  header.topbar .edit-name{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;text-decoration:underline;padding:0;white-space:nowrap;}
  header.topbar .subtitle{color:var(--muted);font-size:13px;margin-top:6px;}

  main{flex:1;padding:18px 20px 8px;}
  section.view{display:none;}
  section.view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .stat-row{display:flex;gap:10px;margin-bottom:18px;}
  .stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;}
  .stat .num{font-family:'Fraunces',serif;font-size:26px;line-height:1;}
  .stat .label{color:var(--muted);font-size:12px;margin-top:4px;}

  .section-title{font-size:15px;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .row-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--line);cursor:pointer;}
  .row-item.ok{border-left-color:var(--green);}
  .row-item.soon{border-left-color:var(--amber);}
  .row-item.late{border-left-color:var(--red);}
  .row-item .who{flex:1;min-width:0;}
  .row-item .who .nm{font-weight:600;font-size:15px;}
  .row-item .who .sub{color:var(--muted);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:11px;font-weight:600;padding:4px 8px;border-radius:20px;white-space:nowrap;}
  .badge.ok{background:#E7F2E9;color:var(--green);}
  .badge.soon{background:#FBF0DE;color:var(--amber);}
  .badge.late{background:#FBE7EA;color:var(--red);}

  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:12px;}

  button.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:12px 16px;font-size:14.5px;font-weight:600;cursor:pointer;width:100%;}
  button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;cursor:pointer;}
  button.wa{background:#E7F2E9;color:var(--green);border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;max-width:440px;width:calc(100% - 40px);z-index:6;}

  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;max-width:480px;margin:0 auto;}
  nav.tabbar button{flex:1;background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-family:'Inter';cursor:pointer;}
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar .ico{font-size:18px;}

  .modal-bg{position:fixed;inset:0;background:rgba(36,18,32,.45);display:none;align-items:flex-end;z-index:20;}
  .modal-bg.active{display:flex;}
  .modal{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:20px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14.5px;font-family:'Inter';background:#fff;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}

  .carnet{background:linear-gradient(135deg,var(--accent),#9C2E48);color:#fff;border-radius:16px;padding:22px;text-align:center;margin-bottom:16px;}
  .carnet h3{color:#fff;font-size:19px;}
  .carnet .plan{opacity:.85;font-size:13px;margin-top:2px;}
  .carnet #qrbox{background:#fff;display:inline-block;padding:10px;border-radius:10px;margin-top:14px;}
  .carnet .venc{margin-top:12px;font-size:12.5px;opacity:.9;}

  #reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .scan-result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;margin-bottom:12px;}
  .scan-result.ok{border-color:var(--green);}
  .day-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .day-chips button{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted);cursor:pointer;}
  .day-chips button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .class-time{font-family:'Fraunces';font-size:17px;min-width:56px;}
</style>
</head>

<!-- MODAL: alumna form -->
<div class="modal-bg" id="modalAlumna">
  <div class="modal" style="position:relative;">
    <button class="close-x" onclick="closeModal('modalAlumna')">✕</button>
    <h3 id="alumnaModalTitle">Nueva alumna</h3>
    <input type="hidden" id="alumnaId">
    <div class="field"><label>Nombre</label><input id="alumnaNombre" placeholder="Nombre y apellido"></div>
    <div class="field"><label>Teléfono (WhatsApp)</label><input id="alumnaTelefono" placeholder="Ej: 70123456"></div>
    <div class="field"><label>Plan</label>
      <select id="alumnaPlan">
        <option value="4">4 clases / mes</option>
        <option value="8">8 clases / mes</option>
        <option value="ilimitado">Ilimitado / mes</option>
      </select>
    </div>
    <div class="field"><label>Precio (Bs)</label><input id="alumnaPrecio" type="number" placeholder="Ej: 250"></div>
    <div class="field"><label>Vence el</label><input id="alumnaVence" type="date"></div>
    <div class="modal-actions">
      <button class="ghost" id="btnEliminarAlumna" style="display:none" onclick="eliminarAlumna()">Eliminar</button>
      <button class="primary" onclick="guardarAlumna()">Guardar</button>
    </div>
  </div>
</div>

    <div class="field"><label>Nombre de la clase</label><input id="claseNombre" placeholder="Ej: Ballet infantil"></div>
    <div class="field"><label>Día</label>
      <select id="claseDia">
        <option value="0">Domingo</option><option value="1">Lunes</option><option value="2">Martes</option>
        <option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option>
      </select>
    </div>
    <div class="field"><label>Hora inicio</label><input id="claseInicio" type="time"></div>
    <div class="field"><label>Hora fin</label><input id="claseFin" type="time"></div>
    <div class="modal-actions">
      <button class="ghost" id="btnEliminarClase" style="display:none" onclick="eliminarClase()">Eliminar</button>
      <button class="primary" onclick="guardarClase()">Guardar</button>
    </div>
  </div>
</div>

<script>
/* ---------- Firebase: datos compartidos entre dispositivos ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyD884zYj_UyiMnQbF0MvELmnxCLAzEkN6Y",
  authDomain: "polefitness-37755.firebaseapp.com",
  databaseURL: "https://polefitness-37755-default-rtdb.firebaseio.com",
  projectId: "polefitness-37755",
  storageBucket: "polefitness-37755.firebasestorage.app",
  messagingSenderId: "203324648040",
  appId: "1:203324648040:web:4abcf162811f46c972e9dd"
};
firebase.initializeApp(firebaseConfig);
const dataRef = firebase.database().ref('polefitness_data');

/* ---------- Estado ---------- */
let DB = { academia: 'Studio Pole & Fitness', alumnas: [], clases: [], asistencias: [] };
let currentView = 'inicio'; // vista actual: es local a cada dispositivo, no se sincroniza
let firstLoad = true;

function save(){ dataRef.set(DB); }

dataRef.on('value', snapshot => {
  const val = snapshot.val();
  if(val){
    DB = val;
    if(!DB.alumnas) DB.alumnas=[]; if(!DB.clases) DB.clases=[]; if(!DB.asistencias) DB.asistencias=[];
  } else if(firstLoad){
    save(); // primera vez que se usa: crea el registro inicial en Firebase
  }
  firstLoad = false;
  render();
  if(currentView==='calendario') renderCalendario();
  if(currentView==='cobros') renderCobros();
});

const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtFecha(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-BO',{day:'numeric',month:'short'}); }
function diasHasta(d){ const a=new Date(todayStr()), b=new Date(d); return Math.round((b-a)/86400000); }
function estadoPlan(vence){ const dh=diasHasta(vence); if(dh<0) return 'late'; if(dh<=5) return 'soon'; return 'ok'; }
function estadoLabel(vence){ const dh=diasHasta(vence); if(dh<0) return `Vencida hace ${Math.abs(dh)}d`; if(dh===0) return 'Vence hoy'; if(dh<=5) return `Vence en ${dh}d`; return 'Al día'; }

/* ---------- Navegación ---------- */
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===name));
  currentView=name;
  document.getElementById('fabBtn').style.display = (name==='inicio'||name==='asistencia') ? 'none':'block';
  if(name==='calendario') renderCalendario();
  if(name==='cobros') renderCobros();
  if(name==='asistencia') startScanner();
  else stopScanner();
  render();
}
function fabAction(){
  if(currentView==='alumnas') openAlumnaModal();
  if(currentView==='calendario') openClaseModal();
}

/* ---------- Academia ---------- */
function editAcademia(){
  const n = prompt('Nombre de la academia:', DB.academia);
  if(n){ DB.academia=n; save(); render(); }
}

/* ---------- Alumnas ---------- */
function openAlumnaModal(alumna){
  document.getElementById('alumnaModalTitle').textContent = alumna ? 'Editar alumna' : 'Nueva alumna';
  document.getElementById('alumnaId').value = alumna ? alumna.id : '';
  document.getElementById('alumnaNombre').value = alumna ? alumna.nombre : '';
  document.getElementById('alumnaTelefono').value = alumna ? alumna.telefono : '';
  document.getElementById('alumnaPlan').value = alumna ? alumna.plan : '4';
  document.getElementById('alumnaPrecio').value = alumna ? alumna.precio : '';
  document.getElementById('alumnaVence').value = alumna ? alumna.vence : addDays(todayStr(),30);
  document.getElementById('btnEliminarAlumna').style.display = alumna ? 'block':'none';
  document.getElementById('modalAlumna').classList.add('active');
}
function addDays(d,n){ const dt=new Date(d+'T00:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function guardarAlumna(){
  const id = document.getElementById('alumnaId').value || 'al_'+Date.now();
  const nombre = document.getElementById('alumnaNombre').value.trim();
  if(!nombre){ alert('Escribe el nombre de la alumna'); return; }
  const data = {
    id, nombre,
    telefono: document.getElementById('alumnaTelefono').value.trim(),
    plan: document.getElementById('alumnaPlan').value,
    precio: document.getElementById('alumnaPrecio').value,
    vence: document.getElementById('alumnaVence').value || addDays(todayStr(),30)
  };
  const idx = DB.alumnas.findIndex(a=>a.id===id);
  if(idx>=0) DB.alumnas[idx]=data; else DB.alumnas.push(data);
  save(); closeModal('modalAlumna'); render();
}
function eliminarAlumna(){
  const id=document.getElementById('alumnaId').value;
  if(!confirm('¿Eliminar esta alumna?')) return;
  DB.alumnas = DB.alumnas.filter(a=>a.id!==id);
  save(); closeModal('modalAlumna'); render();
}
let carnetAlumnaId=null;
function abrirCarnet(id){
  const a = DB.alumnas.find(x=>x.id===id); if(!a) return;
  carnetAlumnaId=id;
  document.getElementById('carnetNombre').textContent=a.nombre;
  document.getElementById('carnetPlan').textContent = a.plan==='ilimitado' ? 'Plan ilimitado' : `Plan ${a.plan} clases/mes`;
  document.getElementById('carnetVence').textContent = `Vence: ${fmtFecha(a.vence)} · ${estadoLabel(a.vence)}`;
  document.getElementById('qrbox').innerHTML='';
  new QRCode(document.getElementById('qrbox'), {text:a.id, width:150, height:150, colorDark:'#241220', colorLight:'#ffffff'});
  document.getElementById('modalCarnet').classList.add('active');
}
function renovarDesdeCarnet(){
  const a = DB.alumnas.find(x=>x.id===carnetAlumnaId); if(!a) return;
  a.vence = addDays(a.vence < todayStr() ? todayStr() : a.vence, 30);
  save(); abrirCarnet(a.id); render();
}
function editarDesdeCarnet(){
  const a = DB.alumnas.find(x=>x.id===carnetAlumnaId);
  closeModal('modalCarnet'); showView('alumnas'); openAlumnaModal(a);
}
function enviarRecordatorio(){
  const a = DB.alumnas.find(x=>x.id===carnetAlumnaId); if(!a) return;
  if(!a.telefono){ alert('Esta alumna no tiene teléfono registrado'); return; }
  const dh = diasHasta(a.vence);
  let msg;
  if(dh<0) msg = `Hola ${a.nombre.split(' ')[0]}! Te escribimos de ${DB.academia}: tu membresía venció el ${fmtFecha(a.vence)}. Cuando puedas, pasa a renovar para seguir con tus clases 💃`;
  else msg = `Hola ${a.nombre.split(' ')[0]}! Te recordamos que tu membresía en ${DB.academia} vence el ${fmtFecha(a.vence)}. ¡Te esperamos! 💃`;
  const tel = a.telefono.replace(/\D/g,'');
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
}

/* ---------- Clases (calendario) ---------- */
let calSelectedDay = new Date().getDay();
function renderDayChips(containerId, onSelect, selectedGetter){
  const el = document.getElementById(containerId); el.innerHTML='';
  DIAS_CORTO.forEach((d,i)=>{
    const b=document.createElement('button');
    b.textContent=d; if(selectedGetter()===i) b.classList.add('active');
    b.onclick=()=>onSelect(i);
    el.appendChild(b);
  });
}
function renderCalendario(){
  renderDayChips('dayChips', (i)=>{calSelectedDay=i; renderCalendario();}, ()=>calSelectedDay);
  document.getElementById('calDayTitle').textContent = 'Clases del ' + DIAS[calSelectedDay];
  const list = document.getElementById('clasesDiaList');
  const clases = DB.clases.filter(c=>+c.dia===calSelectedDay).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  if(!clases.length){ list.innerHTML='<div class="empty">No hay clases este día. Toca “Agregar clase” para crear una.</div>'; return; }
  list.innerHTML = clases.map(c=>`
    <div class="row-item" onclick='openClaseModal(${JSON.stringify(c).replace(/'/g,"&apos;")})'>
      <div class="class-time">${c.inicio}</div>
      <div class="who"><div class="nm">${c.nombre}</div><div class="sub">${c.inicio} – ${c.fin}</div></div>
    </div>`).join('');
}
function openClaseModal(c){
  document.getElementById('claseId').value = c ? c.id : '';
  document.getElementById('claseNombre').value = c ? c.nombre : '';
  document.getElementById('claseDia').value = c ? c.dia : calSelectedDay;
  document.getElementById('claseInicio').value = c ? c.inicio : '';
  document.getElementById('claseFin').value = c ? c.fin : '';
  document.getElementById('btnEliminarClase').style.display = c ? 'block':'none';
  document.getElementById('modalClase').classList.add('active');
}
function guardarClase(){
  const id = document.getElementById('claseId').value || 'cl_'+Date.now();
  const nombre = document.getElementById('claseNombre').value.trim();
  if(!nombre){ alert('Escribe el nombre de la clase'); return; }
  const data = { id, nombre, dia: document.getElementById('claseDia').value,
    inicio: document.getElementById('claseInicio').value || '00:00',
    fin: document.getElementById('claseFin').value || '00:00' };
  const idx = DB.clases.findIndex(c=>c.id===id);
  if(idx>=0) DB.clases[idx]=data; else DB.clases.push(data);
  save(); closeModal('modalClase'); renderCalendario(); render();
}
function eliminarClase(){
  const id=document.getElementById('claseId').value;
  if(!confirm('¿Eliminar esta clase?')) return;
  DB.clases = DB.clases.filter(c=>c.id!==id);
  save(); closeModal('modalClase'); renderCalendario(); render();
}

/* ---------- Cobros ---------- */
let cobrosFilter='todas';
function renderCobros(){
  const chips=document.getElementById('cobrosFilterChips'); chips.innerHTML='';
  [['todas','Todas'],['late','Vencidas'],['soon','Por vencer'],['ok','Al día']].forEach(([key,label])=>{
    const b=document.createElement('button'); b.textContent=label;
    if(cobrosFilter===key) b.classList.add('active');
    b.onclick=()=>{cobrosFilter=key; renderCobros();};
    chips.appendChild(b);
  });
  const list=document.getElementById('cobrosList');
  let alumnas = [...DB.alumnas].sort((a,b)=>a.vence.localeCompare(b.vence));
  if(cobrosFilter!=='todas') alumnas = alumnas.filter(a=>estadoPlan(a.vence)===cobrosFilter);
  if(!alumnas.length){ list.innerHTML='<div class="empty">No hay alumnas en este filtro.</div>'; return; }
  list.innerHTML = alumnas.map(a=>{
    const est=estadoPlan(a.vence);
    return `<div class="row-item ${est}" onclick="abrirCarnet('${a.id}')">
      <div class="who"><div class="nm">${a.nombre}</div><div class="sub">${a.plan==='ilimitado'?'Ilimitado':a.plan+' clases'} · Bs ${a.precio||'—'}</div></div>
      <span class="badge ${est}">${estadoLabel(a.vence)}</span>
    </div>`;
  }).join('');
}

/* ---------- Asistencia / escáner ---------- */
let html5Scanner=null;
function startScanner(){
  if(html5Scanner) return;
  const readerEl=document.getElementById('reader');
  html5Scanner = new Html5Qrcode('reader');
  Html5Qrcode.getCameras().then(cams=>{
    if(!cams.length){ readerEl.innerHTML='<div class="empty">No se encontró cámara en este dispositivo.</div>'; return; }
    html5Scanner.start({facingMode:'environment'}, {fps:10, qrbox:220}, onScanSuccess).catch(()=>{
      readerEl.innerHTML='<div class="empty">No se pudo acceder a la cámara. Revisa los permisos del navegador.</div>';
    });
  }).catch(()=>{ readerEl.innerHTML='<div class="empty">No se encontró cámara en este dispositivo.</div>'; });
}
function stopScanner(){
  if(html5Scanner){ html5Scanner.stop().catch(()=>{}); html5Scanner.clear().catch(()=>{}); html5Scanner=null; }
}
function onScanSuccess(decodedText){
  const a = DB.alumnas.find(x=>x.id===decodedText);
  const box = document.getElementById('scanResult');
  if(!a){ box.innerHTML = `<div class="scan-result">Carnet no reconocido.</div>`; return; }
  const hoy=todayStr();
  const yaHoy = DB.asistencias.find(r=>r.alumnaId===a.id && r.fecha===hoy);
  if(!yaHoy){ DB.asistencias.push({alumnaId:a.id, fecha:hoy, hora:new Date().toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'})}); save(); }
  box.innerHTML = `<div class="scan-result ok"><strong>${a.nombre}</strong><br>Asistencia registrada ✓ — ${estadoLabel(a.vence)}</div>`;
  render();
}

/* ---------- Render general ---------- */
function render(){
  document.getElementById('academiaName').textContent = DB.academia;
  document.title = DB.academia;
  document.getElementById('todaySub').textContent = new Date().toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'});

  // stats
  document.getElementById('statActivas').textContent = DB.alumnas.length;
  const diaHoy = new Date().getDay();
  const clasesHoy = DB.clases.filter(c=>+c.dia===diaHoy).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  document.getElementById('statHoy').textContent = clasesHoy.length;
  const pendientes = DB.alumnas.filter(a=>estadoPlan(a.vence)!=='ok');
  document.getElementById('statPend').textContent = pendientes.length;

  // clases hoy
  const chl = document.getElementById('clasesHoyList');
  chl.innerHTML = clasesHoy.length ? clasesHoy.map(c=>`
    <div class="row-item">
      <div class="class-time">${c.inicio}</div>
      <div class="who"><div class="nm">${c.nombre}</div><div class="sub">${c.inicio} – ${c.fin}</div></div>
    </div>`).join('') : '<div class="empty">No hay clases programadas para hoy.</div>';

  // pendientes de pago
  const pl = document.getElementById('pendList');
  const pend2 = [...pendientes].sort((a,b)=>a.vence.localeCompare(b.vence)).slice(0,5);
  pl.innerHTML = pend2.length ? pend2.map(a=>{
    const est=estadoPlan(a.vence);
    return `<div class="row-item ${est}" onclick="abrirCarnet('${a.id}')">
      <div class="who"><div class="nm">${a.nombre}</div><div class="sub">${estadoLabel(a.vence)}</div></div>
      <span class="badge ${est}">${a.plan==='ilimitado'?'Ilim.':a.plan+' cl.'}</span>
    </div>`;
  }).join('') : '<div class="empty">Todas las membresías están al día 🎉</div>';

  // alumnas
  document.getElementById('countAlumnas').textContent = DB.alumnas.length ? `(${DB.alumnas.length})` : '';
  const al = document.getElementById('alumnasList');
  al.innerHTML = DB.alumnas.length ? [...DB.alumnas].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a=>{
    const est=estadoPlan(a.vence);
    return `<div class="row-item ${est}" onclick="abrirCarnet('${a.id}')">
      <div class="who"><div class="nm">${a.nombre}</div><div class="sub">${a.plan==='ilimitado'?'Ilimitado':a.plan+' clases/mes'}</div></div>
      <span class="badge ${est}">${estadoLabel(a.vence)}</span>
    </div>`;
  }).join('') : '<div class="empty">Aún no hay alumnas. Toca “Agregar alumna” para comenzar.</div>';

  // asistencia hoy
  const ah = document.getElementById('asistenciaHoyList');
  const hoy=todayStr();
  const regsHoy = DB.asistencias.filter(r=>r.fecha===hoy).sort((a,b)=>b.hora.localeCompare(a.hora));
  ah.innerHTML = regsHoy.length ? regsHoy.map(r=>{
    const a = DB.alumnas.find(x=>x.id===r.alumnaId);
    return `<div class="row-item"><div class="who"><div class="nm">${a?a.nombre:'—'}</div><div class="sub">${r.hora}</div></div></div>`;
  }).join('') : '<div class="empty">Aún no se registró asistencia hoy.</div>';
}
</script>
</body>
</html>
